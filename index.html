<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nkosuo Microfinance</title>
<style>
:root{--ink:#17264a;--ink-soft:rgba(23,38,74,.1);--accent:#d1a03a;--accent-soft:rgba(209,160,58,.16);--accent-ink:#1a1405;
--paper:#f3f4f7;--card:#fff;--line:#e2e6ec;--text:#1b2433;--muted:#667487;
--ok:#1b9a62;--ok-bg:#e2f5ec;--warn:#b76e00;--warn-bg:#fdf0d9;--bad:#d24545;--bad-bg:#fbe5e5;--info:#2f6fda;--info-bg:#e4edfc;
--r:10px;--font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.45 var(--font);color:var(--text);background:var(--paper);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(320px,46%) 1fr}
.login-l{background:var(--ink);color:#eef1f8;padding:56px 52px;display:flex;flex-direction:column;justify-content:space-between}
.login-l .mono{width:56px;height:56px;font-size:24px;border-radius:15px}
.login-l h1{font-size:34px;line-height:1.12;margin:26px 0 12px;font-weight:700;letter-spacing:-.4px}
.login-l p.tag{font-size:16px;color:rgba(238,241,248,.75);max-width:34ch}
.login-l ul{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.login-l li{display:flex;gap:12px;align-items:flex-start;color:rgba(238,241,248,.86);font-size:14.5px}
.login-l li i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px}
.login-r{display:grid;place-items:center;padding:32px}
.login-card{width:100%;max-width:380px}
.login-card h2{font-size:22px;margin-bottom:4px}
.login-card .sub{color:var(--muted);margin-bottom:22px}
.login-card .btn{width:100%;padding:11px;margin-top:6px}
.login-card .demo{margin-top:16px;font-size:13px;color:var(--muted)}
@media(max-width:820px){.login{grid-template-columns:1fr}.login-l{padding:28px}.login-l h1{font-size:26px}.login-l ul{display:none}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
.side{background:var(--ink);color:#e9edf7;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:4px 6px 18px}
.mono{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.brand b{display:block;font-size:14.5px;line-height:1.2}
.brand small{color:rgba(233,237,247,.62);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;padding-right:2px}
.nav .gap{height:10px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:rgba(233,237,247,.8);padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;font-size:14.5px}
.nav button svg,.ico{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:650}
.side .foot{margin-top:auto;padding:14px 6px 0;border-top:1px solid rgba(255,255,255,.14);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.side .foot b{display:block;font-size:13.5px}
.side .foot span{color:rgba(233,237,247,.6)}
.side .foot button{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.2px}
.top .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.net{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px 6px 12px;cursor:pointer;font-size:13.5px;font-weight:600}
.net .dot{width:9px;height:9px;border-radius:50%;background:#9aa6b5}
.net.on{border-color:#a9dcc3;background:var(--ok-bg);color:#0f6b43}
.net.on .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(27,154,98,.18)}
.chip{font-size:13.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff}
.chip b{color:var(--text)}
.chip i{font-style:normal;color:var(--warn);font-weight:600;margin-left:6px}
.view{padding:24px 28px 70px;max-width:1280px;width:100%}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:column;padding:10px}
 .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}.nav .gap{display:none}
 .nav button{white-space:nowrap;padding:8px 10px}.side .foot{display:none}.brand{padding-bottom:8px}
 .top,.view{padding-left:14px;padding-right:14px}
}

/* ---------- basics ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card>h3,.card-h{font-size:15.5px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}.num{text-align:right;white-space:nowrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:grid;gap:16px}
@media(max-width:980px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:#bfc8d4}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:12px 20px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .sp{flex:1}
input,select,textarea{border:1px solid #cdd4de;border-radius:8px;padding:8px 10px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.search{max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:650;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:#0f6b43}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:#a82c2c}.b-info{background:var(--info-bg);color:#1f52ad}.b-mute{background:#eceff3;color:#4d5a6b}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:650;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc}
td{padding:10px 12px;border-bottom:1px solid #edf0f4;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbfd}
td.acts,th.acts{text-align:right;white-space:nowrap}
td.acts .btn{margin-left:4px}
.tc{padding:0;overflow:hidden}
.sub2{display:block;color:var(--muted);font-size:12.5px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:2px}
.strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.strip .s{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13.5px;color:var(--muted)}
.strip .s b{display:block;color:var(--text);font-size:17px;line-height:1.25}
.prog{height:8px;border-radius:99px;background:#e9edf2;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}
.prog.warn i{background:#e0a020}.prog.bad i{background:var(--bad)}.prog.acc i{background:var(--accent)}

/* ---------- forms + modal ---------- */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:block}.fld.full{grid-column:1/-1}
.fld>span{display:block;font-size:13px;font-weight:650;color:#455266;margin-bottom:4px}
.fld small{color:var(--muted);font-size:12.5px}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.modal-back{position:fixed;inset:0;background:rgba(14,22,38,.5);display:grid;place-items:center;padding:18px;z-index:80;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;box-shadow:0 24px 70px rgba(10,18,32,.35)}
.modal.wide{max-width:820px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal h3{font-size:17px}
.modal .x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
.mbody{padding:20px;max-height:68vh;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
#toast-root{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:80vw}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}

/* ---------- dashboard ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hello h2{font-size:24px;letter-spacing:-.3px}
.hello p{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px}
.kpi.bad{border-left-color:var(--bad)}.kpi.warn{border-left-color:#e0a020}.kpi.ok{border-left-color:var(--ok)}.kpi.info{border-left-color:var(--info)}
.kl{display:block;color:var(--muted);font-size:13.5px}
.kv{display:block;font-size:26px;font-weight:750;letter-spacing:-.5px;margin:2px 0}
.ks{display:block;color:var(--muted);font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:12px var(--font);fill:#667487}
.chart .v{font-weight:700;fill:#1b2433}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf0f4}
.list li:last-child{border-bottom:0}
.list b{display:block;font-weight:650}
.list span{color:var(--muted);font-size:13px}
.list em{font-style:normal;font-weight:700;white-space:nowrap}

/* ---------- scan / result ---------- */
.scan{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media(max-width:980px){.scan{grid-template-columns:1fr}}
.scanbox{text-align:center;padding:28px 22px}
.scanbox .big{font-size:20px;font-weight:700;margin:6px 0 4px}
.scanbox input.code{font-size:22px;text-align:center;letter-spacing:2px;padding:14px;margin:14px 0 6px;border-width:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.seg button{border:0;background:#fff;padding:8px 20px;cursor:pointer;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.tryit{margin-top:16px;text-align:left}
.tryit>span{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.res-back{position:fixed;inset:0;background:rgba(14,22,38,.55);display:grid;place-items:center;z-index:90;padding:18px}
.res-card{background:#fff;border-radius:18px;width:100%;max-width:400px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.res-banner{padding:22px;text-align:center;color:#fff}
.res-banner.ok{background:var(--ok)}.res-banner.bad{background:var(--bad)}.res-banner.warn{background:#d98a11}
.res-banner b{display:block;font-size:26px;letter-spacing:.5px}
.res-body{padding:22px;text-align:center}
.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:var(--ink);color:#fff;font-size:24px;font-weight:700}
.res-body h4{font-size:20px}
.res-body .rows{margin-top:14px;background:#f5f7fa;border-radius:10px;padding:8px 14px;text-align:left}
.res-body .rows div{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;gap:10px}
.res-body .rows div span:first-child{color:var(--muted)}
.res-body .rows div span:last-child{font-weight:650;text-align:right}
@media(prefers-reduced-motion:reduce){.res-card{animation:none}}

/* ---------- till ---------- */
.till{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media(max-width:1000px){.till{grid-template-columns:1fr}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:96px}
.tile:hover{border-color:var(--accent)}
.tile b{font-size:14px;line-height:1.25}
.tile .p{margin-top:auto;font-weight:750;font-size:15.5px}
.tile small{color:var(--muted)}
.tile.out{opacity:.5}
.tile.blocked{background:var(--bad-bg);border-color:#efbcbc}
.cartline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #edf0f4}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer;font-size:16px}
.qty span{min-width:24px;text-align:center;font-weight:650}
.totalrow{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:12px 0}
.rcpt{font:13px/1.4 "Courier New",monospace;width:300px;margin:0 auto;color:#000}
.rcpt h4{text-align:center;font-size:16px;margin:0}
.rcpt .c{text-align:center}
.rcpt hr{border:0;border-top:1px dashed #000;margin:8px 0}
.rcpt .l{display:flex;justify-content:space-between;gap:8px}
.rcpt .b{font-weight:700;font-size:15px}

/* ---------- boards ---------- */
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:1100px){.kan{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.kan{grid-template-columns:1fr}}
.col{background:#eef1f5;border-radius:12px;padding:10px;min-height:200px}
.col h4{font-size:14px;display:flex;justify-content:space-between;padding:2px 4px 10px}
.col h4 span{background:#fff;border-radius:99px;padding:0 9px;font-size:13px}
.qc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.qc .n{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:800;margin-right:8px}
.qc b{font-size:14.5px}
.qc p{font-size:13px;color:var(--muted);margin:4px 0 8px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.room{background:#fff;border:1px solid var(--line);border-top:5px solid var(--ok);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;min-height:118px;display:flex;flex-direction:column;gap:2px}
.room:hover{box-shadow:0 4px 14px rgba(20,30,50,.1)}
.room .no{font-size:22px;font-weight:800;letter-spacing:-.3px}
.room small{color:var(--muted)}
.room .who{margin-top:auto;font-weight:650;font-size:13.5px}
.room.occupied{border-top-color:var(--bad)}.room.cleaning{border-top-color:#e0a020}.room.maintenance{border-top-color:#8896a8;opacity:.75}
.seatwrap{max-width:330px;margin:0 auto;padding:18px 16px;background:#eef1f5;border-radius:26px 26px 14px 14px}
.cab{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:0 6px 12px}
.srow{display:grid;grid-template-columns:1fr 1fr 22px 1fr 1fr;gap:8px;margin-bottom:8px}
.seat{height:38px;border-radius:8px;border:1px solid #b9c4d2;background:#fff;font-weight:700;cursor:pointer;font-size:13.5px}
.seat:hover{border-color:var(--accent);background:var(--accent-soft)}
.seat.sold{background:#cfd6df;color:#7d8998;cursor:not-allowed;border-color:#cfd6df}
.tripcard{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;width:100%;margin-bottom:8px;display:block}
.tripcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tripcard b{display:block}
.tripcard span{color:var(--muted);font-size:13px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:10px;justify-content:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #b9c4d2;background:#fff;margin-right:5px;vertical-align:-2px}
.legend i.s{background:#cfd6df;border-color:#cfd6df}
.sms-out .m{max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea{resize:vertical}

/* NYANSATEK credit: logo + "by NYANSATEK" after the product name */
.nt-by{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.02em;line-height:1.2;white-space:nowrap;opacity:.92;vertical-align:middle}.nt-by .nt-logo{width:18px;height:18px;flex:none;display:block}.nt-by b{font-weight:800;letter-spacing:.06em}.nt-by.nt-lg{font-size:13.5px;gap:7px}.nt-by.nt-lg .nt-logo{width:22px;height:22px}
.brand .nt-by{display:flex;margin-top:3px;color:rgba(233,237,247,.75)}.nt-line{display:flex;align-items:center;gap:8px;margin:18px 0 0;font-size:13.5px;font-weight:600;color:rgba(238,241,248,.85)}.nt-line .nt-logo{width:24px;height:24px;flex:none}.nt-line b{font-weight:800;letter-spacing:.06em}
</style>
</head>
<body>
<div id="login" class="login" hidden></div>
<div id="app" class="app" hidden>
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script>
(function(){
'use strict';
const K=window.K={};
let C=null,S=null,user=null,cur='dashboard';

/* ================= helpers ================= */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=(n,l)=>String(n).padStart(l||2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const parse=s=>{const p=String(s).slice(0,10).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return dstr(d);};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/86400000);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtDate=s=>{if(!s)return '\u2014';const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();};
const fmtDay=s=>{const d=parse(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];};
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const money=n=>'GH\u20B5'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const firstName=n=>{n=String(n||'').replace(/^((mr|mrs|ms|dr|pharm|rev|pastor|elder|nurse|madam|hon|prof|deaconess|deacon)\.?\s+)+/i,'');return n.split(/\s+/)[0]||'';};
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const hex2rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';};
Object.assign(K,{firstName,esc,pad,today,addDays,diffDays,fmtDate,fmtDay,nowTime,money,sum,initials,dstr,parse});
K.rng=seed=>{let s=(seed>>>0)||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};};
K.pick=(r,arr)=>arr[Math.floor(r()*arr.length)];

/* ================= storage ================= */
const KEY=()=>'nyansatek_sample_'+C.id;
function save(){try{localStorage.setItem(KEY(),JSON.stringify(S));}catch(e){}}
function load(){
  let d=null;try{d=JSON.parse(localStorage.getItem(KEY()));}catch(e){}
  if(d&&d.v===C.version){S=d;}else{reseed();}
}
function reseed(){
  S={v:C.version,seq:1000,online:false,sms:{balance:C.smsBalance||850},
     settings:Object.assign({org:C.name,sender:C.sender,phone:C.phone||''},C.settings||{}),t:{}};
  S.t=C.seed(K);
  S.t.sms=S.t.sms||[];S.t.activity=S.t.activity||[];
  save();
}
Object.defineProperty(K,'S',{get:()=>S});
K.save=save;
K.T=n=>{if(!S.t[n])S.t[n]=[];return S.t[n];};
K.uid=p=>(p||'x')+(++S.seq);
K.get=(n,id)=>K.T(n).find(r=>r.id===id);
K.add=(n,row)=>{row.id=row.id||K.uid(n[0]);K.T(n).push(row);save();return row;};
K.upd=(n,id,patch)=>{const r=K.get(n,id);if(r)Object.assign(r,patch);save();return r;};
K.del=(n,id)=>{S.t[n]=K.T(n).filter(r=>r.id!==id);save();};
K.code=(prefix,table,field)=>{
  field=field||'code';let max=0;
  K.T(table).forEach(r=>{const m=String(r[field]||'').match(/(\d+)$/);if(m&&String(r[field]).indexOf(prefix)===0)max=Math.max(max,+m[1]);});
  return prefix+pad(max+1,4);
};
K.setting=(k,v)=>{if(v!==undefined){S.settings[k]=v;save();}return S.settings[k];};
K.user=()=>user;
K.log=text=>{const a=K.T('activity');a.unshift({id:K.uid('a'),at:new Date().toISOString(),text});if(a.length>60)a.length=60;save();};

/* ================= SMS queue ================= */
const segs=m=>Math.max(1,Math.ceil(String(m).length/160));
K.sms=(to,msg,kind,name)=>{
  if(!to)return false;
  K.T('sms').unshift({id:K.uid('m'),to:String(to),name:name||'',msg,kind:kind||'General',status:'queued',at:new Date().toISOString(),credits:segs(msg)});
  save();chromeTop();
  if(S.online)flushSMS();
  return true;
};
function flushSMS(){
  let n=0,f=0;
  K.T('sms').slice().reverse().forEach(m=>{
    if(m.status!=='queued')return;
    if(S.sms.balance>=m.credits){S.sms.balance-=m.credits;m.status='sent';m.sentAt=new Date().toISOString();n++;}
    else{m.status='failed';m.err='Not enough SMS credit';f++;}
  });
  save();chromeTop();return{n,f};
}
function setOnline(v){
  S.online=v;save();
  if(v){const r=flushSMS();K.toast(r.n||r.f?('Connected \u2014 '+r.n+' SMS sent'+(r.f?', '+r.f+' failed (no credit)':'')):'Connected \u2014 nothing waiting to send',r.f?'bad':'ok');}
  else K.toast('Disconnected \u2014 the system keeps working offline');
  chromeTop();if(cur==='sms')K.render();
}
K.setOnline=setOnline;

K.modal=o=>{
  const root=document.getElementById('modal-root');
  const w=document.createElement('div');w.className='modal-back';
  w.innerHTML='<div class="modal'+(o.wide?' wide':'')+'" role="dialog" aria-modal="true"><header><h3>'+esc(o.title)+'</h3><button class="x" data-close aria-label="Close">\u00D7</button></header><div class="mbody">'+o.body+'</div><footer>'+(o.buttons||[]).map((b,i)=>'<button type="button" class="btn '+(b.cls||'')+'" data-b="'+i+'">'+esc(b.l)+'</button>').join('')+'</footer></div>';
  const close=()=>{w.remove();document.removeEventListener('keydown',key);};
  const key=e=>{if(e.key==='Escape'&&root.lastElementChild===w)close();};
  document.addEventListener('keydown',key);
  w.addEventListener('mousedown',e=>{if(e.target===w)close();});
  w.addEventListener('click',e=>{
    if(e.target.closest('[data-close]')){close();return;}
    const b=e.target.closest('[data-b]');
    if(b){const def=o.buttons[+b.dataset.b];const r=def.fn?def.fn(w,close):undefined;if(r!==false)close();}
  });
  root.appendChild(w);
  const f=w.querySelector('input:not([type=hidden]),select,textarea');if(f&&!o.noFocus)f.focus();
  if(o.onOpen)o.onOpen(w,close);
  return{close,el:w};
};

K.formModal=o=>{
  const v=o.values||{};
  const fld=f=>{
    const val=v[f.k]!=null?v[f.k]:(f.def!=null?f.def:'');
    let inp;
    const optsOf=()=>((typeof f.opts==='function'?f.opts():f.opts)||[]).map(x=>typeof x==='object'?x:{v:x,l:x});
    if(f.t==='select'){
      inp='<select name="'+f.k+'">'+(f.blank===false?'':'<option value="">\u2014 choose \u2014</option>')+optsOf().map(x=>'<option value="'+esc(x.v)+'"'+(String(x.v)===String(val)?' selected':'')+'>'+esc(x.l)+'</option>').join('')+'</select>';
    }else if(f.t==='pick'){
      const os=optsOf();const cur2=os.find(x=>String(x.v)===String(val));
      inp='<input name="'+f.k+'" list="dl_'+f.k+'" autocomplete="off" value="'+esc(cur2?cur2.l:'')+'" placeholder="'+esc(f.ph||'Start typing a name\u2026')+'"><datalist id="dl_'+f.k+'">'+os.map(x=>'<option value="'+esc(x.l)+'"></option>').join('')+'</datalist>';
    }else if(f.t==='textarea'){
      inp='<textarea name="'+f.k+'" rows="3">'+esc(val)+'</textarea>';
    }else{
      inp='<input name="'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(val)+'"'+(f.step?' step="'+f.step+'"':'')+(f.min!=null?' min="'+f.min+'"':'')+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+(f.ro?' readonly':'')+'>';
    }
    return '<label class="fld'+(f.w==='full'||f.t==='textarea'?' full':'')+'"><span>'+esc(f.l)+(f.req?' *':'')+'</span>'+inp+(f.hint?'<small>'+esc(f.hint)+'</small>':'')+'</label>';
  };
  return K.modal({title:o.title,wide:o.wide,body:'<form class="fgrid" onsubmit="return false">'+o.fields.map(fld).join('')+'</form>'+(o.foot||''),
    buttons:[{l:'Cancel'},{l:o.saveLabel||'Save',cls:'pri',fn:w=>{
      const out={};
      for(const f of o.fields){
        const el=w.querySelector('[name="'+f.k+'"]');let x=el?el.value.trim():'';
        if(f.t==='pick'){
          const os=((typeof f.opts==='function'?f.opts():f.opts)||[]).map(y=>typeof y==='object'?y:{v:y,l:y});
          if(x){const m=os.find(y=>y.l===x);if(!m){K.toast('Choose "'+f.l+'" from the list','bad');el.focus();return false;}x=m.v;}
        }
        if(f.req&&x===''){K.toast('Fill in: '+f.l,'bad');if(el)el.focus();return false;}
        if(f.t==='number'&&x!=='')x=Number(x);
        out[f.k]=x;
      }
      return o.onSave(out,w);
    }}]});
};

/* ================= generic CRUD view ================= */
K.crud=(el,d)=>{
  const st={q:'',chip:0,rng:d.range?(d.range.def||'all'):'all'};
  const RNG=[['today','Today'],['week','Last 7 days'],['month','Last 30 days'],['all','All']];
  const inRange=r=>{
    if(!d.range||st.rng==='all')return true;
    const v=String(r[d.range.key]||'').slice(0,10),t=today();
    if(st.rng==='today')return v===t;if(st.rng==='week')return v>=addDays(t,-6)&&v<=t;if(st.rng==='month')return v>=addDays(t,-29)&&v<=t;return true;
  };
  const list=()=>{
    let r=K.T(d.table).filter(inRange);
    if(d.chips&&d.chips[st.chip]&&d.chips[st.chip].fn)r=r.filter(d.chips[st.chip].fn);
    if(st.q){const q=st.q.toLowerCase();r=r.filter(x=>(d.search||[]).some(k=>String(typeof k==='function'?k(x):(x[k]==null?'':x[k])).toLowerCase().indexOf(q)>-1));}
    if(d.sort)r=r.slice().sort(d.sort);
    return r;
  };
  const cols=d.cols.slice();
  const hasActs=!d.noEdit||!d.noDelete||(d.actions&&d.actions.length);
  const tbl=r=>{
    const c=cols.concat(hasActs?[{l:'',cls:'acts',f:row=>
      (d.actions||[]).filter(a=>!a.show||a.show(row)).map(a=>'<button class="btn sm '+(a.cls||'')+'" data-act="row" data-a="'+a.a+'" data-id="'+row.id+'">'+esc(a.l)+'</button>').join('')+
      (d.noEdit?'':'<button class="btn sm" data-act="edit" data-id="'+row.id+'">Edit</button>')+
      (d.noDelete?'':'<button class="btn sm bad" data-act="del" data-id="'+row.id+'">Delete</button>')}]:[]);
    return K.table(c,r,{empty:d.empty||'Nothing here yet',emptySub:d.emptySub||(d.noAdd?'':'Use the add button to create the first one.')});
  };
  const paintBody=()=>{const r=list();const b=el.querySelector('#cbody'),s=el.querySelector('#csum');if(b)b.innerHTML=tbl(r);if(s)s.innerHTML=d.summary?d.summary(r):'';};
  const paint=()=>{
    el.innerHTML='<div class="bar">'+(d.search?'<input class="search" data-inp="q" placeholder="'+esc(d.searchPh||'Search\u2026')+'" value="'+esc(st.q)+'">':'')+
      (d.chips?K.chips(d.chips.map(c=>c.l),st.chip,'chip'):'')+
      (d.range?K.chips(RNG.map(x=>x[1]),RNG.findIndex(x=>x[0]===st.rng),'rng'):'')+
      '<span class="sp"></span>'+(d.topHtml||'')+(d.noAdd?'':'<button class="btn pri" data-act="add">+ '+esc(d.addLabel||'Add')+'</button>')+'</div><div id="csum"></div><div class="card tc" id="cbody"></div>';
    paintBody();
  };
  const form=(row)=>K.formModal({title:(row?'Edit ':'Add ')+(d.noun||'record'),fields:typeof d.fields==='function'?d.fields(row):d.fields,values:row||(d.defaults?d.defaults():{}),wide:d.wide,
    onSave:v=>{
      if(d.validate){const m=d.validate(v,row);if(m){K.toast(m,'bad');return false;}}
      if(row){const out=d.before?d.before(v,row):v;K.upd(d.table,row.id,out);if(d.after)d.after(K.get(d.table,row.id),false);}
      else{const out=d.before?d.before(v,null):v;const nr=K.add(d.table,out);if(d.after)d.after(nr,true);K.log('Added '+(d.noun||'record')+(nr.name?': '+nr.name:''));}
      K.toast('Saved','ok');paint();
    }});
  const ext={};Object.keys(d.on||{}).forEach(k=>{ext[k]=(id,b)=>d.on[k](id,b,paint);});
  K.bind(el,Object.assign({
    q:v=>{st.q=v;paintBody();},
    chip:i=>{st.chip=+i;paint();},
    rng:i=>{st.rng=RNG[+i][0];paint();},
    add:()=>form(null),
    edit:id=>form(K.get(d.table,id)),
    del:id=>{const row=K.get(d.table,id);K.confirm('Delete this '+(d.noun||'record')+(row&&row.name?' ('+row.name+')':'')+'? This cannot be undone.','Delete',()=>{K.del(d.table,id);if(d.afterDelete)d.afterDelete(row);K.toast('Deleted');paint();},'bad');},
    row:(id,b)=>{const a=d.actions.find(x=>x.a===b.dataset.a);if(a)a.fn(K.get(d.table,id),paint);}
  },ext));
  paint();
  return{paint};
};

K.till=(el,d)=>{
  const st={cart:[],q:'',cat:0,method:d.methods[0],tender:''};
  const items=()=>K.T(d.items);
  const cats=()=>['All'].concat(Array.from(new Set(items().map(d.catOf))).sort());
  const inCart=id=>{const l=st.cart.find(x=>x.id===id);return l?l.qty:0;};
  const total=()=>sum(st.cart,l=>l.qty*l.price);
  el.innerHTML='<div class="till"><section><div class="bar"><input class="search" id="tq" data-inp="q" placeholder="Search '+esc(d.noun)+'\u2026"><div id="tcats"></div></div><div class="tgrid" id="tgrid"></div></section><aside class="card" id="tcart"></aside></div>';
  const drawCats=()=>{el.querySelector('#tcats').innerHTML=K.chips(cats(),st.cat,'cat');};
  const drawGrid=()=>{
    const cl=cats()[st.cat]||'All';const q=st.q.toLowerCase();
    const list=items().filter(it=>(cl==='All'||d.catOf(it)===cl)&&(!q||(it.name+' '+(it.sku||'')).toLowerCase().indexOf(q)>-1));
    el.querySelector('#tgrid').innerHTML=list.length?list.map(it=>{
      const info=d.info(it);const blk=d.block?d.block(it):null;
      return '<button type="button" class="tile'+(it.stock<=0?' out':'')+(blk?' blocked':'')+'" data-act="add" data-id="'+it.id+'"><b>'+esc(it.name)+'</b><small>'+esc(info.sub||'')+'</small><span class="p">'+money(it.price)+'</span><small>'+(blk?esc(blk):(it.stock<=0?'Out of stock':it.stock+' in stock'))+'</small></button>';
    }).join(''):K.empty('No match','Try another name.');
  };
  const drawCart=()=>{
    const t=total();const tender=st.tender===''?t:Number(st.tender);const change=Math.max(0,tender-t);
    el.querySelector('#tcart').innerHTML='<h3 class="card-h">Current '+esc(d.saleNoun)+'</h3>'+
      (st.cart.length?st.cart.map(l=>'<div class="cartline"><div><b>'+esc(l.name)+'</b><span class="sub2">'+money(l.price)+' each</span></div><div class="qty"><button data-act="dec" data-id="'+l.id+'" aria-label="Less">\u2212</button><span>'+l.qty+'</span><button data-act="inc" data-id="'+l.id+'" aria-label="More">+</button></div><b>'+money(l.qty*l.price)+'</b></div>').join(''):K.empty('Cart is empty','Tap an item to add it.'))+
      '<div class="totalrow"><span>Total</span><span>'+money(t)+'</span></div>'+
      (d.fields||[]).map(f=>'<label class="fld" style="margin-bottom:8px"><span>'+esc(f.l)+(f.req?' *':'')+'</span>'+(f.t==='select'?'<select id="tf_'+f.k+'">'+(typeof f.opts==='function'?f.opts():f.opts).map(o=>{o=typeof o==='object'?o:{v:o,l:o};return '<option value="'+esc(o.v)+'">'+esc(o.l)+'</option>';}).join('')+'</select>':'<input id="tf_'+f.k+'" type="'+(f.t||'text')+'" placeholder="'+esc(f.ph||'')+'">')+'</label>').join('')+
      '<label class="fld" style="margin-bottom:8px"><span>Payment</span><select data-chg="method">'+d.methods.map(m=>'<option'+(m===st.method?' selected':'')+'>'+esc(m)+'</option>').join('')+'</select></label>'+
      (st.method==='Cash'?'<label class="fld" style="margin-bottom:8px"><span>Cash received</span><input type="number" step="0.01" id="tender" data-inp="tender" value="'+(st.tender===''?'':esc(st.tender))+'" placeholder="'+t.toFixed(2)+'"></label><div class="small muted" style="margin-bottom:8px">Change: <b>'+money(change)+'</b></div>':'')+
      '<button class="btn acc lg" style="width:100%" data-act="pay"'+(st.cart.length?'':' disabled')+'>Complete '+esc(d.saleNoun)+'</button>'+
      (st.cart.length?'<button class="btn sm" style="width:100%;margin-top:8px" data-act="clear">Clear cart</button>':'');
  };
  const addItem=id=>{
    const it=K.get(d.items,id);if(!it)return;
    const blk=d.block?d.block(it):null;if(blk){K.toast(blk,'bad');return;}
    if(inCart(id)+1>it.stock){K.toast('Only '+it.stock+' left in stock','bad');return;}
    const l=st.cart.find(x=>x.id===id);if(l)l.qty++;else st.cart.push({id,name:it.name,price:it.price,qty:1});
    drawCart();
  };
  const complete=()=>{
    if(!st.cart.length)return;
    const vals={};
    for(const f of (d.fields||[])){const e2=el.querySelector('#tf_'+f.k);vals[f.k]=e2?e2.value.trim():'';if(f.req&&!vals[f.k]){K.toast('Fill in: '+f.l,'bad');return;}}
    if(d.validate){const m=d.validate(st.cart,vals,st.method);if(m){K.toast(m,'bad');return;}}
    const t=total();const tender=st.method==='Cash'?(st.tender===''?t:Number(st.tender)):t;
    if(st.method==='Cash'&&tender<t){K.toast('Cash received is less than the total','bad');return;}
    const n=K.T(d.sales).length+1;
    const sale=Object.assign({ref:d.prefix+pad(n,4),date:today(),time:nowTime(),items:st.cart.map(l=>({id:l.id,name:l.name,qty:l.qty,price:l.price})),total:t,method:st.method,tendered:tender,change:Math.max(0,tender-t),cashier:user?user.name:''},vals);
    K.add(d.sales,sale);
    st.cart.forEach(l=>{const it=K.get(d.items,l.id);if(it)it.stock=Math.max(0,it.stock-l.qty);});
    save();
    if(d.onSale)d.onSale(sale);
    K.log(d.saleNoun[0].toUpperCase()+d.saleNoun.slice(1)+' '+sale.ref+' \u2014 '+money(t));
    st.cart=[];st.tender='';drawGrid();drawCart();
    K.showReceipt(d.receipt(sale));
  };
  K.bind(el,{
    q:v=>{st.q=v;drawGrid();},cat:i=>{st.cat=+i;drawCats();drawGrid();},
    add:id=>addItem(id),
    inc:id=>addItem(id),
    dec:id=>{const l=st.cart.find(x=>x.id===id);if(!l)return;l.qty--;if(l.qty<=0)st.cart=st.cart.filter(x=>x.id!==id);drawCart();},
    clear:()=>{st.cart=[];drawCart();},
    method:v=>{st.method=v;drawCart();},
    tender:v=>{st.tender=v;const t=total();const c=Math.max(0,(v===''?t:Number(v))-t);const s=el.querySelector('#tcart .small b');if(s)s.textContent=money(c);},
    pay:complete
  });
  drawCats();drawGrid();drawCart();
};

/* ================= dashboard ================= */
K.barChart=(data,unit)=>{
  const W=440,H=190,pl=8,pb=26,pt=22,n=data.length,bw=(W-pl*2)/n;
  const max=Math.max(1,...data.map(x=>x.v));
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img">'+data.map((x,i)=>{
    const h=Math.max(2,(x.v/max)*(H-pb-pt)),x0=pl+i*bw+bw*.18,w=bw*.64,y=H-pb-h;
    return '<rect x="'+x0.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4" fill="var(--accent)"/>'+
      '<text class="v" x="'+(x0+w/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+esc(unit==='money'?Math.round(x.v).toLocaleString('en-US'):x.v)+'</text>'+
      '<text x="'+(x0+w/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(x.l)+'</text>';
  }).join('')+'</svg></div>';
};
K.lastDays=(n,fn)=>{const out=[];for(let i=n-1;i>=0;i--){const d=addDays(today(),-i);out.push({l:DOW[parse(d).getDay()],d,v:fn(d)});}return out;};
K.list=(items,emptyMsg)=>items.length?'<ul class="list">'+items.map(i=>'<li><div><b>'+esc(i.t)+'</b><span>'+esc(i.s||'')+'</span></div><em>'+(i.rHtml||esc(i.r||''))+'</em></li>').join('')+'</ul>':K.empty(emptyMsg||'Nothing to show yet');
function renderDashboard(el){

  const act=K.T('activity').slice(0,7).map(a=>({t:a.text,s:new Date(a.at).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}));

   '<div class="kpis">'+d.kpis.map(k=>'<div class="kpi '+(k.tone||'')+'"><span class="kl">'+esc(k.l)+'</span><b class="kv">'+esc(k.v)+'</b><span class="ks">'+esc(k.s||'')+'</span></div>').join('')+'</div>'+

     '<label class="fld" id="onew" style="margin-bottom:10px"><span>Phone number</span><input id="sn" type="tel" placeholder="0240000000"></label>'+
     ((C.smsTemplates||[]).length?'<div class="chips" style="margin-bottom:10px">'+C.smsTemplates.map((t,i)=>'<button type="button" data-act="tpl" data-id="'+i+'">'+esc(t.l)+'</button>').join('')+'</div>':'')+
     '<label class="fld"><span>Message</span><textarea id="sm" rows="5" data-inp="count" placeholder="Type your message. {name} is replaced with each person\u2019s name."></textarea></label>'+
     '<div class="small muted" id="scount" style="margin:6px 0 12px">0 characters \u00B7 1 credit each</div>'+
     '<button class="btn acc" data-act="send">Queue message</button> <span class="small muted">Sent as <b>'+esc(S.settings.sender)+'</b> from your own Hubtel account</span></div>'+
     '<div class="card sms-out"><div class="card-h"><span>Outbox</span><button class="btn sm" data-act="clr">Clear sent</button></div>'+
     (q.length?K.table([{l:'To',f:m=>esc(m.name||m.to)+'<span class="sub2">'+esc(m.to)+'</span>'},{l:'Message',f:m=>'<div class="m" title="'+esc(m.msg)+'">'+esc(m.msg)+'</div>'},{l:'Status',f:m=>m.status==='sent'?K.badge('Sent','ok'):m.status==='queued'?K.badge('Waiting for internet','warn'):K.badge('Failed','bad')}],q.slice(0,40)):K.empty('No messages yet','Messages you queue will show up here.'))+
     (q.some(m=>m.status==='queued')?'<div class="bar" style="margin:12px 0 0"><button class="btn ok" data-act="conn">'+(S.online?'Send waiting messages':'Connect to send')+'</button></div>':'')+
     '</div></div>';
    const sg=el.querySelector('#sg');sg.onchange=()=>{el.querySelector('#onew').style.display=sg.value===''?'block':'none';};
  };
  draw();
  const keep=()=>{st.msg=el.querySelector('#sm').value;st.to=el.querySelector('#sg').value;};
  K.bind(el,{
    count:v=>{el.querySelector('#scount').textContent=v.length+' characters \u00B7 '+segs(v)+' credit'+(segs(v)>1?'s':'')+' each';},
    tpl:i=>{el.querySelector('#sm').value=C.smsTemplates[+i].text;el.querySelector('#sm').dispatchEvent(new Event('input',{bubbles:true}));},
    clr:()=>{S.t.sms=K.T('sms').filter(m=>m.status!=='sent');save();draw();},
    conn:()=>{setOnline(true);},
    send:()=>{
      const msg=el.querySelector('#sm').value.trim();const gi=el.querySelector('#sg').value;
      if(!msg){K.toast('Type a message first','bad');return;}
      let people;
      if(gi==='')people=[{name:'',phone:el.querySelector('#sn').value.trim()}];else people=groups[+gi].people();
      people=people.filter(p=>p.phone);
      if(!people.length){K.toast('No phone numbers to send to','bad');return;}
      people.forEach(p=>K.sms(p.phone,msg.replace(/\{name\}/g,firstName(p.name)||'there'),'Broadcast',p.name));
      K.log('Queued '+people.length+' SMS');K.toast(people.length+' message'+(people.length>1?'s':'')+' queued','ok');
      draw();
    }
  });
}

   '<div class="login-r"><form class="login-card" id="lf"><h2>Sign in</h2><p class="sub">Choose who is using the system.</p><label class="fld" style="margin-bottom:12px"><span>User</span><select id="lu">'+C.users.map((u,i)=>'<option value="'+i+'">'+esc(u.name)+' \u2014 '+esc(u.role)+'</option>').join('')+'</select></label><label class="fld"><span>Password</span><input type="password" value="demo1234" autocomplete="off"></label><button class="btn pri" type="submit">Sign in</button><p class="demo">Sample edition: the password is filled in for you.</p></form></div>';
  document.getElementById('lf').onsubmit=e=>{e.preventDefault();user=C.users[+document.getElementById('lu').value];try{sessionStorage.setItem(KEY()+'_u',JSON.stringify(user));}catch(x){}enter();};
}
function enter(){
  document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;
  cur='dashboard';go('dashboard');
}
K.start=cfg=>{
  C=cfg;
  const r=document.documentElement.style;
  r.setProperty('--ink',C.ink);r.setProperty('--accent',C.accent);r.setProperty('--accent-ink',C.accentInk||'#1a1405');
  r.setProperty('--accent-soft',hex2rgba(C.accent,.18));r.setProperty('--ink-soft',hex2rgba(C.ink,.1));
  document.title=C.name+' \u2014 '+C.product;
  const st=document.createElement('style');st.textContent=RCPT_CSS;document.head.appendChild(st);
  load();
  let u=null;try{u=JSON.parse(sessionStorage.getItem(KEY()+'_u'));}catch(e){}
  if(u){user=u;enter();}else showLogin();
};
})();

</script>
<script>
const {esc,money,T,add,upd,get,today,addDays,diffDays,fmtDate,fmtDay,badge,sum,pad,nowTime}=K;
const r2=n=>Math.round(n*100)/100;
const mOf=id=>get('members',id)||{name:'—',phone:''};
const mOpts=()=>T('members').map(m=>({v:m.id,l:m.name+' ('+m.code+')'}));
const gOpts=()=>T('groups').map(g=>({v:g.id,l:g.name}));
const borrowerName=l=>l.kind==='Individual'?mOf(l.memberId).name:(get('groups',l.groupId)||{}).name||'—';
const borrowerPhone=l=>l.kind==='Individual'?mOf(l.memberId).phone:mOf((get('groups',l.groupId)||{}).leaderId).phone;
const outstandingOf=l=>sum(T('loanSchedule').filter(r=>r.loanId===l.id),r=>r2(r.amountDue-r.amountPaid));
const hasOverdue=l=>T('loanSchedule').some(r=>r.loanId===l.id&&r.status!=='paid'&&r.dueDate<today());
const nextInstallment=l=>{const r=T('loanSchedule').filter(x=>x.loanId===l.id).sort((a,b)=>a.seq-b.seq).find(x=>x.amountPaid<x.amountDue);return r?r2(r.amountDue-r.amountPaid):0;};
const statusOf=l=>{if(l.status==='active'&&hasOverdue(l))return['Overdue','bad'];const M={pending:['Pending','warn'],active:['Active','ok'],completed:['Completed','mute'],rejected:['Rejected','bad']};return M[l.status]||[l.status,'mute'];};
const schedRows=(principal,rate,termMonths,start)=>{const total=r2(principal+principal*rate/100),per=r2(total/termMonths),rows=[];
 for(let i=1;i<=termMonths;i++){const amt=i===termMonths?r2(total-per*(termMonths-1)):per;rows.push({seq:i,dueDate:addDays(start,i*30),amountDue:amt,amountPaid:0,status:'pending'});}return rows;};
const maturityValue=i=>r2(i.principal+i.principal*(i.rate/100)*(i.term/(i.termUnit==='Days'?365:12)));
const valueOf=i=>{if(i.type==='Shares')return r2(i.principal+(i.dividendsPaid||0));const mv=maturityValue(i);if(today()>=i.maturityDate)return mv;
 const span=Math.max(1,diffDays(i.maturityDate,i.startDate)),elapsed=Math.max(0,diffDays(today(),i.startDate));return r2(i.principal+(mv-i.principal)*Math.min(1,elapsed/span));};
const invStatus=i=>i.status==='paid_out'?['Paid out','mute']:(i.type!=='Shares'&&i.maturityDate<=today()?['Matured','warn']:['Active','ok']);

   for(let k=0;k<s[2]-1;k++){susuTx.push({id:'st'+(tn++),accountId:acc.id,date:addDays(t,-(s[2]-1-k)),amount:acc.dailyAmount,type:'collect',collector:acc.agent});acc.balance=r2(acc.balance+acc.dailyAmount);acc.cycleCount++;}
   susuAccounts.push(acc);
  });

  // ---- savings ----
  const SV=[['m2',3200],['m4',850],['m6',5400],['m8',1200],['m10',9600],['m11',430],['m12',2750],['m13',6100]];
  const savingsAccounts=[],savingsTx=[];let an=1,vn=1;
  SV.forEach(s=>{
   const opened=addDays(t,-(180+an*11));
   const acc={id:'sv'+an,accNo:'NKM-S-'+pad(an,4),memberId:s[0],balance:0,opened};an++;
   const opening=Math.round(s[1]*0.4);
   savingsTx.push({id:'sx'+(vn),accountId:acc.id,date:opened,time:'09:1'+vn,type:'Deposit',amount:opening,balance:opening,teller:'Nana Adjei'});vn++;
   let bal=opening;
   const mid=Math.round((s[1]-opening)*0.6);
   savingsTx.push({id:'sx'+(vn),accountId:acc.id,date:addDays(t,-14),time:'11:20',type:'Deposit',amount:mid,balance:bal=r2(bal+mid),teller:'Nana Adjei'});vn++;
   const rest=r2(s[1]-bal);
   if(rest>0){savingsTx.push({id:'sx'+(vn),accountId:acc.id,date:addDays(t,-3),time:'14:05',type:'Deposit',amount:rest,balance:bal=r2(bal+rest),teller:'Nana Adjei'});vn++;}
   acc.balance=bal;
   savingsAccounts.push(acc);
  });

  // ---- investments ----
  const IV=[
   ['m2','Fixed Deposit',5000,18,6,'Months',-200],
   ['m4','Fixed Deposit',12000,16,12,'Months',-60],
   ['m6','Treasury Bill',3000,27,91,'Days',-100],
   ['m8','Treasury Bill',8000,25,182,'Days',-30],
   ['m10','Shares',1000,12,null,null,-400],
   ['m12','Shares',2500,12,null,null,-250],
   ['m13','Shares',4000,10,null,null,-500]
  ];
  const investments=IV.map((x,i)=>{
   const startDate=addDays(t,x[6]);
   const isShares=x[1]==='Shares';
   const maturityDate=isShares?null:addDays(startDate,x[5]==='Days'?x[4]:x[4]*30);
   return{id:'iv'+(i+1),certNo:'NKM-INV-'+pad(i+1,4),memberId:x[0],type:x[1],principal:x[2],rate:x[3],term:x[4],termUnit:x[5],startDate,maturityDate,status:'active',dividendsPaid:i===5?150:0};
  });

  // ---- groups ----
  const groups=[
   {id:'g1',name:'Adepa Women’s Group',leaderId:'m3',memberIds:['m3','m5','m7','m9','m11']},
   {id:'g2',name:'Kotoko Traders Group',leaderId:'m2',memberIds:['m2','m6','m10','m13']}
  ];

  // ---- loans + schedule + payments ----
  let ssq=1,psq=1;
  const loanSchedule=[],loanPayments=[];
  const makeLoan=(num,kind,who,principal,rate,termMonths,purpose,guarantor,disbOffset,appOffset,paidCount,forceStatus)=>{
   const applied=addDays(t,appOffset);
   const disbursed=disbOffset==null?null:addDays(t,disbOffset);
   const loan={id:'l'+num,code:'NKM-L-'+pad(num,4),kind,purpose,guarantor:guarantor||'',status:forceStatus||(disbursed?'active':'pending'),appliedDate:applied,disbursedDate:disbursed,principal,rate,termMonths,officer:'Kwabena Asare'};
   if(kind==='Individual')loan.memberId=who;else loan.groupId=who;
   if(disbursed){
    const rows=schedRows(principal,rate,termMonths,disbursed);
    rows.forEach((row,i)=>{
     const sr={id:'ls'+(ssq++),loanId:loan.id,seq:row.seq,dueDate:row.dueDate,amountDue:row.amountDue,amountPaid:0,status:'pending'};
     if(i<paidCount){sr.amountPaid=sr.amountDue;sr.status='paid';loanPayments.push({id:'lp'+(psq++),loanId:loan.id,date:row.dueDate,amount:row.amountDue,method:i%2?'Mobile Money':'Cash'});}
     loanSchedule.push(sr);
    });
    if(paidCount>=termMonths)loan.status='completed';
   }
   return loan;
  };
  const loans=[
   makeLoan(1,'Individual','m4',3000,15,6,'Working capital for provisions shop','Comfort Frimpong',-100,-110,2),
   makeLoan(2,'Individual','m8',1500,12,4,'School fees','Yaw Mensah',-150,-160,4),

   makeLoan(6,'Group','g2',6000,15,6,'Bulk purchase of goods','',-15,-20,0)
  ];

  return{members,susuAccounts,susuTx,savingsAccounts,savingsTx,investments,groups,loans,loanSchedule,loanPayments};
 },

   drawGroups();
   K.crud(el.querySelector('#loanCrud'),{table:'loans',noun:'loan',addLabel:'New loan application',search:[l=>borrowerName(l),'code','purpose'],searchPh:'Search loans…',sort:(a,b)=>b.appliedDate.localeCompare(a.appliedDate),
    chips:[{l:'All'},{l:'Individual',fn:l=>l.kind==='Individual'},{l:'Group',fn:l=>l.kind==='Group'},{l:'Pending',fn:l=>l.status==='pending'},{l:'Active',fn:l=>l.status==='active'},{l:'Completed',fn:l=>l.status==='completed'}],
    cols:[
     {l:'Loan',f:l=>'<b>'+esc(l.code)+'</b><span class="sub2">'+esc(borrowerName(l))+'</span>'},
     {l:'Kind',f:l=>badge(l.kind,l.kind==='Group'?'info':'mute')},
     {l:'Principal',cls:'num',f:l=>money(l.principal)},
     {l:'Term',f:l=>l.rate+'% · '+l.termMonths+' mo'},
     {l:'Outstanding',cls:'num',f:l=>l.status==='active'?money(outstandingOf(l)):(l.status==='completed'?badge('Paid off','ok'):'—')},
     {l:'Status',f:l=>{const s=statusOf(l);return badge(s[0],s[1]);}}
    ],
    fields:[{k:'kind',l:'Loan type',t:'select',opts:['Individual','Group'],blank:false},{k:'memberId',l:'Individual borrower',t:'pick',opts:mOpts,hint:'Required for an individual loan'},
     {k:'groupId',l:'Group borrower',t:'select',opts:gOpts,hint:'Required for a group loan'},{k:'principal',l:'Loan amount (GH₵)',t:'number',step:'0.01',req:1},
     {k:'rate',l:'Interest rate (% flat, over the full term)',t:'number',step:'0.01',req:1},{k:'termMonths',l:'Term (months)',t:'number',min:1,req:1},
     {k:'purpose',l:'Purpose',w:'full'},{k:'guarantor',l:'Guarantor (individual loans)',w:'full'}],
    defaults:()=>({kind:'Individual',rate:15,termMonths:6}),
    validate:v=>v.kind==='Individual'&&!v.memberId?'Choose the individual borrower':(v.kind==='Group'&&!v.groupId?'Choose the group borrower':(!(v.principal>0)?'Enter a loan amount':null)),
    before:(v,row)=>{if(!row){v.code=K.code('NKM-L-','loans');v.status='pending';v.appliedDate=today();v.officer=K.user().name;if(v.kind==='Individual')v.groupId='';else v.memberId='';}return v;},
    actions:[
     {a:'appr',l:'Approve & disburse',cls:'ok',show:l=>l.status==='pending',fn:(l,paint)=>K.confirm('Approve and disburse '+money(l.principal)+' to '+borrowerName(l)+'? A repayment schedule will be created.','Approve',()=>{
      l.status='active';l.disbursedDate=today();
      schedRows(l.principal,l.rate,l.termMonths,today()).forEach(row=>add('loanSchedule',Object.assign({loanId:l.id},row)));
      K.save();const phone=borrowerPhone(l);
      if(phone)K.sms(phone,K.S.settings.org+': Your loan of '+money(l.principal)+' has been approved and disbursed. First repayment due '+fmtDate(addDays(today(),30))+'.','Loan',borrowerName(l));
      K.log('Loan disbursed '+money(l.principal)+' — '+borrowerName(l));paint();K.toast('Loan disbursed','ok');},'ok')},
     {a:'rej',l:'Reject',cls:'bad',show:l=>l.status==='pending',fn:(l,paint)=>K.confirm('Reject this loan application?','Reject',()=>{l.status='rejected';K.save();paint();K.toast('Application rejected');},'bad')},
     {a:'pay',l:'Record repayment',cls:'acc',show:l=>l.status==='active',fn:(l,paint)=>{const out=outstandingOf(l);
      K.formModal({title:'Record repayment — '+borrowerName(l),fields:[{k:'amount',l:'Amount received (GH₵)',t:'number',step:'0.01',req:1,def:nextInstallment(l)},{k:'method',l:'Method',t:'select',opts:['Cash','Mobile Money','Bank transfer'],blank:false}],
       foot:'<p class="small muted" style="margin-top:12px">Outstanding balance: <b>'+money(out)+'</b></p>',
       onSave:v=>{if(!(v.amount>0)){K.toast('Enter an amount','bad');return false;}if(v.amount>out+0.01){K.toast('Amount is more than the outstanding balance ('+money(out)+')','bad');return false;}
        let remain=v.amount;
        T('loanSchedule').filter(row=>row.loanId===l.id).sort((a,b)=>a.seq-b.seq).forEach(row=>{if(remain<=0)return;const due=r2(row.amountDue-row.amountPaid);if(due<=0)return;const pay=Math.min(due,remain);row.amountPaid=r2(row.amountPaid+pay);remain=r2(remain-pay);row.status=row.amountPaid>=row.amountDue-0.01?'paid':'partial';});
        add('loanPayments',{loanId:l.id,date:today(),amount:v.amount,method:v.method});
        const stillOwes=outstandingOf(l)>0.01;if(!stillOwes)l.status='completed';K.save();
        const phone=borrowerPhone(l);
        if(phone)K.sms(phone,K.S.settings.org+': Repayment of '+money(v.amount)+' received. '+(stillOwes?('Outstanding balance: '+money(outstandingOf(l))):'Your loan is now fully repaid. Thank you!'),'Loan',borrowerName(l));
        K.log('Loan repayment '+money(v.amount)+' — '+borrowerName(l));paint();
        K.showReceipt({title:'Loan repayment receipt',meta:[['Loan',l.code],['Borrower',borrowerName(l)],['Date',fmtDate(today())],['Method',v.method]],totals:[['Amount paid',money(v.amount),1],['Outstanding balance',money(outstandingOf(l))]],foot:stillOwes?'Thank you':'Loan fully repaid — thank you!'});}});}},
     {a:'sch',l:'Schedule',show:l=>l.status==='active'||l.status==='completed',fn:l=>{
      const rows=T('loanSchedule').filter(row=>row.loanId===l.id).sort((a,b)=>a.seq-b.seq);
      K.modal({title:'Repayment schedule — '+borrowerName(l),wide:true,body:K.table([{l:'#',cls:'num',k:'seq'},{l:'Due date',f:row=>fmtDate(row.dueDate)},{l:'Amount due',cls:'num',f:row=>money(row.amountDue)},{l:'Paid',cls:'num',f:row=>money(row.amountPaid)},
       {l:'Status',f:row=>row.status==='paid'?badge('Paid','ok'):(row.dueDate<today()?badge('Overdue','bad'):(row.status==='partial'?badge('Partly paid','warn'):badge('Upcoming','mute')))}],rows,{empty:'No schedule yet'}),buttons:[{l:'Close'}]});}}
    ]});
  },

  members(el){
   K.crud(el,{table:'members',noun:'customer',addLabel:'Register customer',search:['name','code','phone'],searchPh:'Search customers…',sort:(a,b)=>a.name.localeCompare(b.name),
    cols:[{l:'Customer',f:m=>'<b>'+esc(m.name)+'</b><span class="sub2">'+esc(m.code)+'</span>'},{l:'Phone',k:'phone'},{l:'ID',f:m=>esc(m.idType)+'<span class="sub2">'+esc(m.idNo)+'</span>'},{l:'Joined',f:m=>fmtDate(m.joined)},{l:'Status',f:m=>badge(m.status==='active'?'Active':'Dormant',m.status==='active'?'ok':'mute')}],
    fields:[{k:'name',l:'Full name',req:1,w:'full'},{k:'phone',l:'Phone',t:'tel',req:1},{k:'gender',l:'Gender',t:'select',opts:['Female','Male']},{k:'idType',l:'ID type',t:'select',opts:['Ghana Card','Voter ID','Passport','Driver’s licence'],blank:false},{k:'idNo',l:'ID number'},{k:'address',l:'Address',w:'full'},{k:'status',l:'Status',t:'select',opts:[{v:'active',l:'Active'},{v:'dormant',l:'Dormant'}],blank:false}],
    defaults:()=>({idType:'Ghana Card',status:'active'}),
    before:(v,row)=>{if(!row){v.code=K.code('NKM-M-','members');v.joined=today();}return v;},
    actions:[{a:'ov',l:'Overview',fn:m=>{
     const sav=T('savingsAccounts').filter(a=>a.memberId===m.id),su=T('susuAccounts').filter(a=>a.memberId===m.id),inv=T('investments').filter(i=>i.memberId===m.id),ln=T('loans').filter(l=>l.kind==='Individual'&&l.memberId===m.id&&l.status==='active');
     const rows=[['Savings balance',money(sum(sav,a=>a.balance))],['Susu balance',money(sum(su,a=>a.balance))],['Investments (current value)',money(sum(inv,valueOf))],['Loans outstanding',money(sum(ln,outstandingOf))]];
     K.modal({title:m.name+' — account overview',body:K.table([{l:'',k:'a'},{l:'',cls:'num',f:x=>x.b}],rows.map(x=>({a:x[0],b:x[1]}))).replace(/<thead>.*<\/thead>/,''),buttons:[{l:'Close'}]});}}]});
  }
 },

 dashboard(K){
  const t=today(),savingsTotal=sum(T('savingsAccounts'),a=>a.balance),susuToday=sum(T('susuTx').filter(x=>x.date===t&&x.type==='collect'),x=>x.amount);
  const activeLoans=T('loans').filter(l=>l.status==='active'),outstandingTotal=sum(activeLoans,outstandingOf),overdue=activeLoans.filter(hasOverdue);
  const maturingSoon=T('investments').filter(i=>i.type!=='Shares'&&i.status==='active'&&i.maturityDate&&i.maturityDate>=t&&diffDays(i.maturityDate,t)<=30).sort((a,b)=>a.maturityDate.localeCompare(b.maturityDate));
  return{
   kpis:[{l:'Savings balance',v:money(savingsTotal),s:T('savingsAccounts').length+' accounts',tone:'ok'},{l:'Susu collected today',v:money(susuToday),s:T('susuAccounts').length+' active susu accounts'},
    {l:'Loans outstanding',v:money(outstandingTotal),s:activeLoans.length+' active loans'},{l:'Loans overdue',v:overdue.length,s:'need follow-up',tone:overdue.length?'bad':'ok'}],
   chart:{title:'Susu collected — last 7 days (GH₵)',unit:'money',data:K.lastDays(7,d=>sum(T('susuTx').filter(x=>x.date===d&&x.type==='collect'),x=>x.amount))},
   lists:[{title:'Loans needing follow-up',items:overdue.slice(0,5).map(l=>({t:borrowerName(l),s:l.code,r:money(outstandingOf(l))})),empty:'No overdue loans right now.'},
    {title:'Investments maturing within 30 days',items:maturingSoon.slice(0,5).map(i=>({t:mOf(i.memberId).name,s:i.type+' · '+i.certNo,r:fmtDate(i.maturityDate)})),empty:'Nothing maturing soon.'}]
  };
 },
 smsGroups(K){
  return [{l:'All customers',people:()=>T('members').map(m=>({name:m.name,phone:m.phone}))},
   {l:'Susu customers',people:()=>T('susuAccounts').map(a=>({name:mOf(a.memberId).name,phone:mOf(a.memberId).phone}))},
   {l:'Customers with an overdue loan',people:()=>T('loans').filter(l=>l.status==='active'&&hasOverdue(l)).map(l=>({name:borrowerName(l),phone:borrowerPhone(l)}))},
   {l:'Investments maturing within 30 days',people:()=>T('investments').filter(i=>i.type!=='Shares'&&i.status==='active'&&i.maturityDate&&i.maturityDate>=today()&&diffDays(i.maturityDate,today())<=30).map(i=>({name:mOf(i.memberId).name,phone:mOf(i.memberId).phone}))}];
 },
 smsTemplates:[
  {l:'Susu reminder',text:'Dear {name}, our agent will visit today to collect your susu contribution. Please have it ready. Thank you for saving with us.'},
  {l:'Loan repayment reminder',text:'Dear {name}, kindly note that your loan repayment is due. Please make payment to avoid late charges. Thank you.'},
  {l:'Investment maturity',text:'Dear {name}, your investment with us is approaching maturity. Please visit the branch to discuss your payout or reinvestment options.'}
 ]
};

</script>
<script>
K.start(APP_CONFIG);
</script>
</body>
</html>
